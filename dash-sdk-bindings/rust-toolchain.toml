[toolchain]
# Keep in sync with ../platform-mobile/rust-toolchain.toml and ../../platform/rust-toolchain.toml.
# All checkouts share one cargo target dir (~/.cargo/config.toml) and rs-sdk's cdylib target
# is emitted as an unhashed libdash_sdk.rlib, so a different toolchain here clobbers it (E0514).
channel = "1.92"
